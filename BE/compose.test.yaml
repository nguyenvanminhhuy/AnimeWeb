name: animeweb-be-tests
services:
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: animeweb_test
      POSTGRES_USER: animeweb_test
      # Public fixture credential, only for this isolated local test container.
      POSTGRES_PASSWORD: animeweb_test_only
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animeweb_test -d animeweb_test"]
      interval: 2s
      timeout: 5s
      retries: 30
